<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhisperPNG</title>

    <!-- Imports -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="/static/style.css" rel="stylesheet" />
  </head>

  <body class="d-flex min-vh-100 align-items-center justify-content-center">
    <main class="container text-center">
      <h1 class="fw-bold mb-4">WhisperPNG | Decode</h1>

      <form
        action="/api/decode"
        method="post"
        enctype="multipart/form-data"
        class="mx-auto"
        style="max-width: 720px"
      >
        <div class="card upload-card shadow-sm">
          <div class="card-body">
            <div
              id="dropzone"
              class="dropzone d-flex flex-column align-items-center justify-content-center mb-3"
              role="button"
              tabindex="0"
              aria-label="File upload."
            >
              <div class="fw-semibold">Drag &amp; Drop Files Here</div>
              <div class="text-muted small mt-2">OR</div>

              <div class="mt-3">
                <button
                  type="button"
                  id="browseBtn"
                  class="btn btn-outline-secondary btn-sm"
                >
                  Browse Files
                </button>
              </div>

              <div
                id="fileName"
                class="mt-1 small text-truncate"
                style="max-width: 360px"
              ></div>
            </div>

            <input
              id="fileInput"
              name="file"
              type="file"
              accept="image/png"
              class="d-none"
              required
            />

            <div class="mt-3">
              <button
                id="uploadBtn"
                type="submit"
                class="btn btn-primary w-100"
                disabled
              >
                Decode
              </button>
            </div>
          </div>
        </div>
      </form>
    </main>

    <div
      class="modal fade"
      id="resultModal"
      tabindex="-1"
      aria-labelledby="resultModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="resultModalLabel">Decoded text</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <pre
              id="resultText"
              class="mb-0"
              style="white-space: pre-wrap; word-break: break-word"
            ></pre>
          </div>
          <div class="modal-footer">
            <button
              id="copyResultBtn"
              type="button"
              class="btn btn-outline-secondary btn-sm"
            >
              Copy
            </button>
            <button
              type="button"
              class="btn btn-secondary btn-sm"
              data-bs-dismiss="modal"
            >
              Close
            </button>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      (function () {
        const fileInput = document.getElementById("fileInput");
        const browseBtn = document.getElementById("browseBtn");
        const dropzone = document.getElementById("dropzone");
        const fileName = document.getElementById("fileName");
        const uploadBtn = document.getElementById("uploadBtn");
        const form = document.querySelector("form");

        const resultModalEl = document.getElementById("resultModal");
        const resultModal = new bootstrap.Modal(resultModalEl, {});
        const resultTextEl = document.getElementById("resultText");
        const resultModalLabel = document.getElementById("resultModalLabel");
        const copyResultBtn = document.getElementById("copyResultBtn");

        function isPngFile(file) {
          if (!file) return false;
          const mimeOk = file.type === "image/png";
          const extOk = file.name && file.name.toLowerCase().endsWith(".png");
          return mimeOk || extOk;
        }

        function showFileInfo(text, isError = false) {
          fileName.textContent = text;
          fileName.classList.toggle("text-danger", isError);
          fileName.classList.toggle("text-muted", !isError);
        }

        function setFileToInput(file) {
          const dt = new DataTransfer();
          dt.items.add(file);
          fileInput.files = dt.files;
          updateFileUI(file);
        }

        function updateFileUI(file) {
          if (!file) {
            showFileInfo("");
            dropzone.classList.remove(
              "border",
              "border-2",
              "border-success",
              "border-danger"
            );
            updateUploadState();
            return;
          }
          if (!isPngFile(file)) {
            showFileInfo("Invalid file type. Please select a PNG.", true);
            fileInput.value = "";
            dropzone.classList.remove("border", "border-success");
            dropzone.classList.add("border", "border-2", "border-danger");
            updateUploadState();
            return;
          }
          showFileInfo(file.name || "Selected file");
          dropzone.classList.remove("border-danger");
          dropzone.classList.add("border", "border-2", "border-success");
          updateUploadState();
        }

        function updateUploadState() {
          const hasFile = fileInput.files && fileInput.files.length > 0;
          uploadBtn.disabled = !hasFile;
        }

        browseBtn.addEventListener("click", function () {
          fileInput.click();
        });

        fileInput.addEventListener("change", function () {
          const f = fileInput.files && fileInput.files[0];
          updateFileUI(f);
        });

        ["dragenter", "dragover"].forEach((evt) =>
          dropzone.addEventListener(evt, function (e) {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.add(
              "bg-light",
              "border",
              "border-2",
              "border-primary"
            );
          })
        );

        ["dragleave", "drop"].forEach((evt) =>
          dropzone.addEventListener(evt, function (e) {
            e.preventDefault();
            e.stopPropagation();
            dropzone.classList.remove(
              "bg-light",
              "border",
              "border-2",
              "border-primary"
            );
          })
        );

        dropzone.addEventListener("drop", function (e) {
          e.preventDefault();
          e.stopPropagation();
          const dt = e.dataTransfer;
          if (dt && dt.files && dt.files.length > 0) {
            const f = dt.files[0];
            setFileToInput(f);
          }
        });

        copyResultBtn.addEventListener("click", async function () {
          const txt = resultTextEl.innerText || "";
          try {
            await navigator.clipboard.writeText(txt);
            const original = copyResultBtn.textContent;
            copyResultBtn.textContent = "Copied!";
            setTimeout(() => (copyResultBtn.textContent = original), 1200);
          } catch (e) {
            try {
              const range = document.createRange();
              range.selectNodeContents(resultTextEl);
              const sel = window.getSelection();
              sel.removeAllRanges();
              sel.addRange(range);
              document.execCommand("copy");
              sel.removeAllRanges();
              const original = copyResultBtn.textContent;
              copyResultBtn.textContent = "Copied!";
              setTimeout(() => (copyResultBtn.textContent = original), 1200);
            } catch (_) {
              copyResultBtn.textContent = "Unable to copy";
              setTimeout(() => (copyResultBtn.textContent = "Copy"), 1200);
            }
          }
        });

        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          if (uploadBtn.disabled) {
            return;
          }
          if (!fileInput.files || fileInput.files.length === 0) {
            resultModalLabel.textContent = "No file selected";
            resultTextEl.textContent = "Please select a PNG file to decode.";
            resultModal.show();
            return;
          }

          const file = fileInput.files[0];
          if (!isPngFile(file)) {
            resultModalLabel.textContent = "Invalid file";
            resultTextEl.textContent = "Selected file is not a PNG.";
            resultModal.show();
            return;
          }

          uploadBtn.disabled = true;
          const originalText = uploadBtn.textContent;
          uploadBtn.textContent = "Decoding...";

          try {
            const fd = new FormData();
            fd.append("decode_image", file);

            const resp = await fetch("/api/decode", {
              method: "POST",
              body: fd,
            });

            if (!resp.ok) {
              let errJson = null;
              try {
                errJson = await resp.json();
              } catch (e) {}
              const errMsg =
                (errJson && (errJson.error || errJson.message)) ||
                (await resp.text().catch(() => resp.statusText));
              throw new Error(errMsg || `Server returned ${resp.status}`);
            }

            let decoded;
            try {
              const json = await resp.json();
              decoded =
                json &&
                (json.message ||
                  json.text ||
                  json.result ||
                  JSON.stringify(json, null, 2));
            } catch (jsonErr) {
              decoded = await resp.text();
            }

            resultModalLabel.textContent = "Decoded text";
            resultTextEl.textContent =
              decoded && decoded.length > 0
                ? decoded
                : "This wasn't encoded by WhisperPNG!";
            resultModal.show();
          } catch (err) {
            resultModalLabel.textContent = "Decode error";
            resultTextEl.textContent = err.message || String(err);
            resultModal.show();
          } finally {
            uploadBtn.disabled = false;
            uploadBtn.textContent = originalText;
          }
        });

        updateFileUI(null);
      })();
    </script>
  </body>
</html>
