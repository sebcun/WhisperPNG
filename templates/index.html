<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhisperPNG</title>

    <!-- Imports -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="/static/style.css" rel="stylesheet" />
  </head>

  <body class="d-flex min-vh-100 align-items-center justify-content-center">
    <main class="container text-center">
      <h1 class="fw-bold mb-4">WhisperPNG</h1>

      <form
        action="/upload"
        method="post"
        enctype="multipart/form-data"
        class="mx-auto"
        style="max-width: 720px"
      >
        <div class="card upload-card shadow-sm">
          <div class="card-body">
            <div
              id="dropzone"
              class="dropzone d-flex flex-column align-items-center justify-content-center mb-3"
              role="button"
              tabindex="0"
              aria-label="File upload dropzone. Click to browse files or drag and drop files here."
            >
              <div class="fw-semibold">Drag &amp; Drop Files Here</div>
              <div class="text-muted small mt-2">OR</div>

              <div class="mt-3">
                <button
                  type="button"
                  id="browseBtn"
                  class="btn btn-outline-secondary btn-sm"
                >
                  Browse Files
                </button>
              </div>

              <div
                id="fileName"
                class="mt-1 small text-truncate"
                style="max-width: 360px"
              ></div>
            </div>

            <input
              id="fileInput"
              name="file"
              type="file"
              accept="image/png"
              class="d-none"
              required
            />

            <div class="mb-3">
              <input
                type="text"
                class="form-control"
                id="message"
                placeholder="Message to Add to Image"
              />
            </div>

            <div class="mt-3">
              <button
                id="uploadBtn"
                type="submit"
                class="btn btn-primary w-100"
                disabled
              >
                Upload
              </button>
            </div>
          </div>
        </div>
      </form>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
